# XcodeGen 설정 — GitHub Actions(Mac)에서 이 파일로 Xcode 프로젝트를 만들어 빌드함
name: BleLcdRemote
options:
  bundleIdPrefix: com.blelcd
  deploymentTarget:
    iOS: "15.0"

targets:
  BleLcdRemote:
    type: application
    platform: iOS
    sources:
      - path: BleLcdRemote
      # 화면(HTML·폰트)은 안드로이드 앱과 같은 폴더를 그대로 사용 → 앱 안에 "assets" 폴더로 들어감
      - path: ../app/src/main/assets
        type: folder
        buildPhase: resources
    info:
      path: BleLcdRemote/Info.plist
      properties:
        CFBundleDisplayName: BLE LCD 리모컨
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSBluetoothAlwaysUsageDescription: LCD 장치와 블루투스로 연결해서 화면을 받고 키를 보내기 위해 사용합니다.
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blelcd.remote
        PRODUCT_NAME: BleLcdRemote
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
