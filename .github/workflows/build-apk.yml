name: Build APK
 
on:
  push:
  workflow_dispatch:
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
 
      - uses: gradle/actions/setup-gradle@v4
 
      - name: Build debug APK
        run: |
          # 프로젝트가 저장소 맨 위에 있든, 폴더 안에 있든 gradlew 위치를 찾아서 빌드
          GW=$(find . -name gradlew -not -path './.git/*' | head -1)
          if [ -z "$GW" ]; then
            echo "::error::gradlew 파일이 없어요. 프로젝트 파일(app 폴더, gradle 폴더, gradlew 등)을 먼저 올려주세요."
            exit 1
          fi
          cd "$(dirname "$GW")"
          echo "프로젝트 위치: $(pwd)"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/BLE-LCD-Remote.apk"
 
      - uses: actions/upload-artifact@v4
        with:
          name: BLE-LCD-Remote-apk
          path: BLE-LCD-Remote.apk
