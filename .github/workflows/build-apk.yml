name: Build APK and AAB

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Find project folder
        id: proj
        run: |
          # 프로젝트가 저장소 맨 위에 있든, 폴더 안에 있든 gradlew 위치를 찾음
          GW=$(find . -name gradlew -not -path './.git/*' | head -1)
          if [ -z "$GW" ]; then
            echo "::error::gradlew 파일이 없어요. 프로젝트 파일(app 폴더, gradle 폴더, gradlew 등)을 먼저 올려주세요."
            exit 1
          fi
          DIR="$(dirname "$GW")"
          chmod +x "$GW"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "프로젝트 위치: $DIR"

      # ---- 바로 설치해서 쓰는 APK (테스트용) ----
      - name: Build APK (install directly on phone)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/BLE-LCD-Remote.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: BLE-LCD-Remote-apk
          path: BLE-LCD-Remote.apk

      # ---- Google Play에 올리는 AAB (업로드 키로 서명) ----
      - name: Restore upload key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 Secret이 없어서 AAB는 만들지 않았어요. README의 'AAB 서명 키 등록'을 따라 Secrets를 등록하세요."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build AAB (Google Play)
        if: steps.key.outputs.ok == 'true'
        working-directory: ${{ steps.proj.outputs.dir }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --no-daemon --stacktrace
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/BLE-LCD-Remote.aab"
          # 서명이 제대로 됐는지 확인
          if jarsigner -verify "$GITHUB_WORKSPACE/BLE-LCD-Remote.aab" | grep -q "jar verified"; then
            echo "AAB 서명 확인됨"
          else
            echo "::error::AAB 서명이 안 됐어요. Secrets 값(비밀번호, KEY_ALIAS)을 확인하세요."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.ok == 'true'
        with:
          name: BLE-LCD-Remote-aab
          path: BLE-LCD-Remote.aab
